spring.application.name=workflow

server.port=8080
server.servlet.context-path=/api

# MongoDB (por defecto: embebido para dev con Flapdoodle)
# En producción, usar el perfil "prod" (application-prod.properties) que define spring.data.mongodb.uri
spring.data.mongodb.database=workflow_db

logging.level.com.workflow=DEBUG

# Subida de archivos — límite por defecto 50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Almacenamiento: "local" (dev) o "s3" (producción)
storage.tipo=${STORAGE_TIPO:local}
storage.local.directorio=uploads

# AWS S3 — sobreescribir en producción con variables de entorno
aws.s3.bucket=${AWS_S3_BUCKET:workflow-documentos}
aws.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# URL pública por la que ESTE backend puede alcanzar al Document Server de OnlyOffice
# para descargar los documentos guardados (la URL que viene en el callback usa el
# nombre/IP interno del contenedor, no accesible desde el host)
onlyoffice.url-publica=${ONLYOFFICE_URL_PUBLICA:http://localhost:8088}