plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Parcial_1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // WEB
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // MONGODB (solo uno, NO reactive)
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // WEBSOCKET
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // SECURITY (porque usas PasswordEncoder)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // VALIDACIONES (jakarta.validation)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // LOMBOK
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // MongoDB embebido — sin servicio externo (tipo SQLite)
    implementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring3x:4.12.2'

    // AWS S3 — almacenamiento de documentos (se activa con storage.tipo=s3)
    implementation 'software.amazon.awssdk:s3:2.25.0'
    implementation 'software.amazon.awssdk:url-connection-client:2.25.0'

    // Exportación PDF — reportes dinámicos (Feature 2)
    implementation 'com.itextpdf:kernel:7.2.5'
    implementation 'com.itextpdf:layout:7.2.5'

    // Exportación Excel — reportes dinámicos (Feature 2)
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // Firebase Admin SDK — notificaciones push FCM
    implementation 'com.google.firebase:firebase-admin:9.2.0'
}

tasks.named('test') {
    useJUnitPlatform()
}